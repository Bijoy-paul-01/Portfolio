  <script type="text/babel">

    const DATA = window.PORTFOLIO_DATA || {};

    const personal = DATA.personal || {};
    const metrics = Array.isArray(DATA.metrics)
      ? DATA.metrics
      : [];

    const skills = DATA.skills || {};
    const projects = Array.isArray(DATA.projects)
      ? DATA.projects
      : [];

    const certifications =
      Array.isArray(DATA.certifications)
        ? DATA.certifications
        : [];

    const experience =
      Array.isArray(DATA.experience)
        ? DATA.experience
        : [];

    const education =
      Array.isArray(DATA.education)
        ? DATA.education
        : [];

    const careerInterests =
      Array.isArray(DATA.careerInterests)
        ? DATA.careerInterests
        : [];

    const additional =
      DATA.additional || {};


    /* =========================================================
       HELPERS
    ========================================================= */

    function textValue(value, fallback = "") {

      if (
        value === null ||
        value === undefined
      ) {
        return fallback;
      }

      if (
        typeof value === "string" ||
        typeof value === "number"
      ) {
        return String(value);
      }

      return fallback;
    }


    function getSocial(name) {

      return (
        personal.social &&
        personal.social[name]
      ) || "";
    }


    /* =========================================================
       ICON
    ========================================================= */

    function Icon({ type, size = 20 }) {

      const common = {
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: "2",
        strokeLinecap: "round",
        strokeLinejoin: "round"
      };


      if (type === "github") {

        return (
          <svg {...common}>
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.2-.4 6.5-1.6 6.5-7A5.4 5.4 0 0 0 19 4.8 5 5 0 0 0 18.9 1S17.7.6 15 2.5a13.4 13.4 0 0 0-7 0C5.3.6 4.1 1 4.1 1A5 5 0 0 0 4 4.8 5.4 5.4 0 0 0 2.5 8.5c0 5.4 3.3 6.6 6.5 7A4.8 4.8 0 0 0 8 18v4" />
            <path d="M8 21c-4 2-4-2-5-2" />
          </svg>
        );
      }


      if (type === "linkedin") {

        return (
          <svg {...common}>
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6Z" />
            <rect x="2" y="9" width="4" height="12" />
            <circle cx="4" cy="4" r="2" />
          </svg>
        );
      }


      if (type === "mail") {

        return (
          <svg {...common}>
            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="2"
            />

            <path d="m3 7 9 6 9-6" />
          </svg>
        );
      }


      if (type === "arrow") {

        return (
          <svg {...common}>
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        );
      }


      if (type === "external") {

        return (
          <svg {...common}>
            <path d="M14 3h7v7" />
            <path d="M10 14 21 3" />
            <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
          </svg>
        );
      }


      if (type === "code") {

        return (
          <svg {...common}>
            <path d="m8 9-3 3 3 3" />
            <path d="m16 9 3 3-3 3" />
            <path d="m14 5-4 14" />
          </svg>
        );
      }


      if (type === "database") {

        return (
          <svg {...common}>
            <ellipse
              cx="12"
              cy="5"
              rx="8"
              ry="3"
            />

            <path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5" />

            <path d="M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7" />
          </svg>
        );
      }


      if (type === "brain") {

        return (
          <svg {...common}>
            <path d="M9.5 3.5A3.5 3.5 0 0 0 6 7a3.5 3.5 0 0 0-2 6.3A3.5 3.5 0 0 0 7.5 20H9V4.5a1 1 0 0 0-.5-1Z" />

            <path d="M14.5 3.5A3.5 3.5 0 0 1 18 7a3.5 3.5 0 0 1 2 6.3 3.5 3.5 0 0 1-3.5 6.7H15V4.5a1 1 0 0 1-.5-1Z" />

            <path d="M9 8h1" />
            <path d="M14 8h1" />
            <path d="M9 13h1" />
            <path d="M14 13h1" />
          </svg>
        );
      }


      if (type === "menu") {

        return (
          <svg {...common}>
            <path d="M4 6h16" />
            <path d="M4 12h16" />
            <path d="M4 18h16" />
          </svg>
        );
      }


      if (type === "close") {

        return (
          <svg {...common}>
            <path d="M6 18 18 6" />
            <path d="m6 6 12 12" />
          </svg>
        );
      }


      return null;
    }

                ))}

              </div>

            )}

          </div>

        </nav>
      );
    }
